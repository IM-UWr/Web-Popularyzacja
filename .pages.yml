# Pages CMS — formularze aktualnej strony Instytutu Matematycznego UWr.
media:
  input: public/pliki
  output: /pliki
  rename: safe
settings:
  commit:
    identity: user
content:
- name: popularyzacja
  label: Strona działu Popularyzacja
  description: Tekst strony Popularyzacja, ramka W skrócie i lata tradycji. Linki pochodzą z menu, a karty odbiorców
    z podstron tego działu.
  type: file
  path: src/data/popularyzacja.md
  format: yaml-frontmatter
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
    description: Nazwa strony lub wpisu, widoczna także na odpowiednich listach i w wynikach wyszukiwania.
  - name: status_publikacji
    label: Status publikacji
    type: select
    required: true
    default: oficjalna
    description: Zapisuje wybór do przyszłej publikacji. Obecnie nie zmienia widoczności. Podgląd jest publiczny.
    options:
      values:
      - name: oficjalna
        label: Opublikowana — strona oficjalna i podgląd
      - name: podglad
        label: Tylko podgląd
  - name: body
    label: Treść
    description: Tekst strony. Nagłówek 2 tworzy sekcję; listy z pogrubionym początkiem tworzą bloki cech lub etapów,
      a nagłówek 3 zakończony pytajnikiem — rozwijane pytanie.
    type: rich-text
    options:
      format: markdown
      path: public/pliki/popularyzacja
  - name: tytul_en
    label: Tytuł EN
    type: string
    description: Angielska wersja pola Tytuł; puste oznacza użycie wersji polskiej.
  - name: tresc_en
    label: Treść EN
    description: Tekst strony po angielsku; puste oznacza wyświetlanie tekstu polskiego. Układ treści jest taki
      sam jak w polskim opisie.
    type: rich-text
    options:
      format: markdown
      path: public/pliki/popularyzacja
  - name: wstep
    label: Opis do wyszukiwarek
    type: text
    description: Opis strony do wyszukiwarek i udostępniania linków; nagłówek nowej strony nie pokazuje tego akapitu.
  - name: haslo
    label: Hasło w nagłówku
    type: string
    description: Krótkie hasło w nagłówku, widoczne razem z liczbami. Na okładce działu służy również jako podpis.
  - name: o_popularyzacji_fakty
    label: W skrócie (obok tekstu „O popularyzacji”)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{wartosc} {opis}'
    fields:
    - name: wartosc
      label: Wartość (np. 4 miasta)
      type: string
      required: true
      description: Krótka wartość, np. 6 semestrów lub A+.
    - name: wartosc_en
      label: 'EN: wartość'
      type: string
      description: Angielska wersja pola Wartość (np. 4 miasta); puste oznacza użycie wersji polskiej.
    - name: opis
      label: Opis
      type: string
      description: Krótki opis używany na stronie lub w jej zapowiedzi.
    - name: opis_en
      label: 'EN: opis'
      type: string
      description: Angielska wersja pola Opis; puste oznacza użycie wersji polskiej.
    description: Wartości i opisy w ramce W skrócie przy tekście o popularyzacji.
  - name: tradycja
    label: Lata tradycji (liczby w banerze; liczba lat liczona przy budowie strony)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{rok} {nazwa}'
    fields:
    - name: rok
      label: Rok założenia
      type: number
      required: true
      description: Rok lub krótki zapis lat wyświetlany przy pozycji.
    - name: nazwa
      label: Nazwa w dopełniaczu (np. Zimowych Szkół → „37 lat Zimowych Szkół”)
      type: string
      required: true
      description: Nazwa wyświetlana na stronie i powiązanych listach.
    - name: nazwa_en
      label: 'EN: nazwa (np. Winter Schools → „37 years of Winter Schools”)'
      type: string
      description: Angielska wersja pola Nazwa w dopełniaczu (np. Zimowych Szkół → „37 lat Zimowych Szkół”); puste
        oznacza użycie wersji polskiej.
    description: Rok rozpoczęcia i nazwa inicjatywy; strona sama oblicza liczbę lat.
  - name: wstep_en
    label: Opis do wyszukiwarek EN
    type: text
    description: Angielska wersja pola Opis do wyszukiwarek; puste oznacza użycie wersji polskiej.
  - name: haslo_en
    label: 'EN: hasło'
    type: string
    description: Angielska wersja hasła; puste oznacza użycie wersji polskiej.
- name: strony
  label: Strony Popularyzacji
  description: Strony informacyjne oraz teksty stron z listami. Adres wynika ze ścieżki pliku; nie zmieniaj nazw
    istniejących plików. Nowe strony nie są dopisywane do menu.
  type: collection
  path: src/content/strony/popularyzacja
  format: yaml-frontmatter
  subfolders: true
  filename: '{primary}.md'
  view:
    fields:
    - tytul
    - status_publikacji
    primary: tytul
  fields:
  - name: tytul
    label: Tytuł (nazwa nad kartą „Dla kogo”)
    type: string
    required: true
    description: Nazwa strony lub wpisu, widoczna także na odpowiednich listach i w wynikach wyszukiwania.
  - name: status_publikacji
    label: Status publikacji
    type: select
    required: true
    default: oficjalna
    description: Zapisuje wybór do przyszłej publikacji. Obecnie nie zmienia widoczności. Podgląd jest publiczny.
    options:
      values:
      - name: oficjalna
        label: Opublikowana — strona oficjalna i podgląd
      - name: podglad
        label: Tylko podgląd
  - name: body
    label: Treść
    type: rich-text
    options:
      format: markdown
      input: public/pliki/popularyzacja
      output: /pliki/popularyzacja
    description: Tekst strony; nagłówek 2 tworzy sekcję. Opcja Bloki włącza układy cech, etapów, kontaktów, plików
      i pytań z list w tekście.
  - name: tytul_en
    label: Tytuł EN
    type: string
    description: Angielska wersja pola Tytuł (nazwa nad kartą „Dla kogo”); puste oznacza użycie wersji polskiej.
  - name: tresc_en
    label: Treść EN
    description: Tekst strony po angielsku; puste oznacza wyświetlanie tekstu polskiego. Układ treści jest taki
      sam jak w polskim opisie.
    type: rich-text
    options:
      format: markdown
      input: public/pliki/popularyzacja
      output: /pliki/popularyzacja
  - name: opis
    label: Opis (baner strony, zdanie na karcie „Dla kogo”)
    type: text
    description: Opis strony do wyszukiwarek i udostępniania linku.
  - name: opis_en
    label: 'EN: opis'
    type: text
    description: Angielska wersja pola Opis (baner strony, zdanie na karcie „Dla kogo”); puste oznacza użycie wersji
      polskiej.
  - name: haslo
    label: Hasło w nagłówku
    type: string
    description: Krótkie hasło w nagłówku, widoczne razem z liczbami. Na okładce działu służy również jako podpis.
  - name: haslo_en
    label: 'EN: hasło'
    type: string
    description: Angielskie hasło; puste pole nie zastępuje go polskim hasłem.
  - name: pasek_boczny
    label: Prawy pasek (puste = spis „Na tej stronie”)
    type: select
    options:
      values:
      - oba
      - spis
      - menu
      - brak
    description: Spis sekcji jest widoczny przy opcji Spis lub Oba. Menu i Brak wyłączają spis; ta wersja strony
      nie wyświetla bocznego menu działu.
  - name: bloki
    label: Kafelki, oś i kontakty z list — zob. ściągawka
    type: boolean
    default: false
    description: 'Włącz, aby z list w tekście powstawały bloki treści: cechy, etapy, kontakty, pliki i pytania.'
  - name: opublikowany
    label: Dotychczasowe uwzględnianie w zestawieniach
    type: boolean
    hidden: true
    default: true
    description: Zachowuje dotychczasową widoczność w zestawieniach i indeksowanie. To osobna opcja od statusu publikacji.
