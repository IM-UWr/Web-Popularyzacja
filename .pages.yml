# Pages CMS — Web-Popularyzacja: Popularyzacja matematyki.
# Wygenerowane przy migracji z Avean/IM-Website-test; pola „Opublikowany” usunięte (bez wersji roboczych).
# Zlecenie 33: pole „Opublikowane” wróciło w Stronach i na stronie działu (odznaczone = szkic, widoczny tylko na Podglądzie).
# Zlecenie 40: tytuł EN pod tytułem i Treść na górze, pola EN pod polskimi, etykiety „… EN”, opis wstępu (tylko Google).
media:
  input: public/pliki
  output: /pliki
  rename: safe
settings:
  commit:
    identity: user
content:
- name: popularyzacja
  label: Strona działu Popularyzacja
  description: 'Strona /popularyzacja: tytuł i tekst „O popularyzacji” (po polsku i po angielsku), niżej drobne pola — tekst pod tytułem, hasło, „W skrócie” i lata tradycji w banerze. Grupy linków nad tekstem biorą się z menu działu, a karty „Dla kogo” — ze „Stron Popularyzacji”.'
  type: file
  path: src/data/popularyzacja.md
  format: yaml-frontmatter
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: tytul_en
    label: Tytuł EN
    type: string
  - name: opublikowany
    label: Opublikowane — widoczne na stronie publicznej (na Podglądzie widać zawsze)
    description: Odznacz, żeby przygotować stronę bez pokazywania jej na stronie publicznej (szkic)
    type: boolean
    default: true
  - name: body
    label: Treść
    description: |-
      Tekst sekcji „O popularyzacji”. Oddziel akapity pustą linią. Pierwszy akapit wyróżnia szablon strony, a pole „W skrócie” uzupełniasz poniżej.
      Specjalne układy otwieraj znacznikiem, np. :::kafelki, i zamykaj osobną linią :::. Zwykły tekst, listy i tabele zapisuj bez znaczników układu.
    type: code
    options:
      format: markdown
  - name: tresc_en
    label: Treść EN
    description: Tekst „O popularyzacji” po angielsku, według tych samych reguł Markdown co pole Treść. Gdy pole jest puste, strona angielska pokazuje tekst polski.
    type: code
    options:
      format: markdown
  - name: format_tresci
    label: Format treści
    type: string
    hidden: true
    default: jawne
  - name: wstep
    label: Opis strony dla Google (1–2 zdania)
    description: Trafia do Google i do podglądu linku; na samej stronie się nie wyświetla. Np. „Kółka, obozy i konkursy dla uczniów…”. Puste = ogólny opis serwisu.
    type: text
  - name: wstep_en
    label: 'Opis strony dla Google EN'
    type: text
  - name: haslo
    label: Hasło (okładka, baner działu, menu telefonu)
    type: string
  - name: haslo_en
    label: 'Hasło EN'
    type: string
  - name: o_popularyzacji_fakty
    label: W skrócie (obok tekstu „O popularyzacji”)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{wartosc} {opis}"
    fields:
    - name: wartosc
      label: Wartość (np. 4 miasta)
      type: string
      required: true
    - name: wartosc_en
      label: 'Wartość EN'
      type: string
    - name: opis
      label: Opis
      type: string
    - name: opis_en
      label: 'Opis EN'
      type: string
    - name: pozycja
      type: boolean
      hidden: true
  - name: tradycja
    label: Lata tradycji (liczby w banerze; liczba lat liczona przy budowie strony)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{rok} {nazwa}"
    fields:
    - name: rok
      label: Rok założenia
      type: number
      required: true
    - name: nazwa
      label: Nazwa w dopełniaczu (np. Zimowych Szkół → „37 lat Zimowych Szkół”)
      type: string
      required: true
    - name: nazwa_en
      label: 'Nazwa EN (np. Winter Schools → „37 years of Winter Schools”)'
      type: string
    - name: pozycja
      type: boolean
      hidden: true
  - name: linki
    label: Linki (techniczne; strona ich nie wyświetla — grupy linków biorą się z menu działu)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{nazwa}"
    hidden: true
    fields:
    - name: nazwa
      label: Nazwa
      type: string
      required: true
    - name: nazwa_en
      label: 'Nazwa EN'
      type: string
    - name: adres
      label: Adres strony (https://… albo /ścieżka na naszej stronie)
      type: string
      required: true
    - name: pozycja
      type: boolean
      hidden: true
- name: strony
  label: Strony Popularyzacji
  description: Adres strony = ścieżka pliku, np. popularyzacja/uczniowie.md → /popularyzacja/uczniowie. Strona z tego katalogu sama dostaje kartę „Dla kogo” na stronie działu; do menu dopisz ją w repozytorium Web-Ustawienia.
  type: collection
  path: src/content/strony/popularyzacja
  format: yaml-frontmatter
  subfolders: true
  filename: '{primary}.md'
  view:
    fields:
    - tytul
    primary: tytul
  fields:
  - name: tytul
    label: Tytuł (nazwa nad kartą „Dla kogo”)
    type: string
    required: true
  - name: tytul_en
    label: Tytuł EN
    type: string
  - name: opublikowany
    label: Opublikowane — widoczne na stronie publicznej (na Podglądzie widać zawsze)
    description: Odznacz, żeby przygotować stronę bez pokazywania jej na stronie publicznej (szkic)
    type: boolean
    default: true
  - name: body
    label: Treść
    type: code
    options:
      format: markdown
    description: |-
      Oddziel akapity pustą linią. Nagłówek ## tworzy sekcję i pozycję w spisie „Na tej stronie”. Zachowaj {#id} przy istniejących nagłówkach, aby działały ich odnośniki.
      Zwykły tekst, listy i tabele zapisuj bez znaczników układu. Do specjalnych układów używaj :::kafelki, :::kontakty, :::linki, :::etapy i :::ramka{tytul="Tytuł"}. Każdy blok zamknij osobną linią ::: i zostaw pustą linię między znacznikiem a treścią.
      Komentarze <!-- ... --> zawierają wskazówki dla redaktorów. Szczegóły opisuje dok/jawny-markdown.md w Web-Core.
  - name: tresc_en
    label: Treść EN
    description: Cała strona po angielsku, według tych samych reguł Markdown co pole Treść. Zachowaj identyfikatory angielskich sekcji. Gdy pole jest puste, strona angielska pokazuje tekst polski.
    type: code
    options:
      format: markdown
  - name: format_tresci
    label: Format treści
    type: string
    hidden: true
    default: jawne
  - name: opis
    label: Opis (zdanie na karcie „Dla kogo”)
    description: Zdanie na karcie tej strony na stronie Popularyzacji; trafia też do Google i do podglądu linku. Na samej stronie się nie wyświetla.
    type: text
  - name: opis_en
    label: 'Opis EN'
    type: text
  - name: haslo
    label: Hasło (tytuł karty „Dla kogo”)
    description: Tytuł karty tej strony na stronie Popularyzacji; puste = tytuł strony. Na samej stronie się nie wyświetla.
    type: string
  - name: haslo_en
    label: 'Hasło EN'
    type: string
  - name: pasek_boczny
    label: Prawy pasek (puste = spis „Na tej stronie”)
    type: select
    options:
      values:
      - oba
      - spis
      - menu
      - brak
