# Pages CMS — Web-Popularyzacja: Popularyzacja matematyki.
# Wygenerowane przy migracji z Avean/IM-Website-test; pola „Opublikowany” usunięte (bez wersji roboczych).
media:
  input: public/pliki
  output: /pliki
  rename: safe
settings:
  commit:
    identity: user
content:
- name: popularyzacja
  label: Strona działu Popularyzacja
  description: 'Strona /popularyzacja: tytuł i tekst „O popularyzacji” (po polsku i po angielsku), niżej drobne pola — tekst pod tytułem, hasło, „W skrócie” i lata tradycji w banerze. Grupy linków nad tekstem biorą się z menu działu, a karty „Dla kogo” — ze „Stron Popularyzacji”.'
  type: file
  path: src/data/popularyzacja.md
  format: yaml-frontmatter
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: body
    label: Treść
    description: |-
      Tekst sekcji „O popularyzacji”. Oddziel akapity pustą linią. Pierwszy akapit wyróżnia szablon strony, a pole „W skrócie” uzupełniasz poniżej.
      Specjalne układy otwieraj znacznikiem, np. :::kafelki, i zamykaj osobną linią :::. Zwykły tekst, listy i tabele zapisuj bez znaczników układu.
    type: code
    options:
      format: markdown
  - name: tytul_en
    label: Tytuł EN
    type: string
  - name: tresc_en
    label: Treść EN
    description: Tekst „O popularyzacji” po angielsku, według tych samych reguł Markdown co pole Treść. Gdy pole jest puste, strona angielska pokazuje tekst polski.
    type: code
    options:
      format: markdown
  - name: format_tresci
    label: Format treści
    type: string
    hidden: true
    default: jawne
  - name: wstep
    label: Tekst pod tytułem
    type: text
  - name: haslo
    label: Hasło (okładka, baner działu, menu telefonu)
    type: string
  - name: o_popularyzacji_fakty
    label: W skrócie (obok tekstu „O popularyzacji”)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{wartosc} {opis}"
    fields:
    - name: wartosc
      label: Wartość (np. 4 miasta)
      type: string
      required: true
    - name: wartosc_en
      label: 'EN: wartość'
      type: string
    - name: opis
      label: Opis
      type: string
    - name: opis_en
      label: 'EN: opis'
      type: string
  - name: tradycja
    label: Lata tradycji (liczby w banerze; liczba lat liczona przy budowie strony)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{rok} {nazwa}"
    fields:
    - name: rok
      label: Rok założenia
      type: number
      required: true
    - name: nazwa
      label: Nazwa w dopełniaczu (np. Zimowych Szkół → „37 lat Zimowych Szkół”)
      type: string
      required: true
    - name: nazwa_en
      label: 'EN: nazwa (np. Winter Schools → „37 years of Winter Schools”)'
      type: string
  - name: wstep_en
    label: 'EN: tekst pod tytułem'
    type: text
  - name: haslo_en
    label: 'EN: hasło'
    type: string
  - name: linki
    label: Linki (techniczne; strona ich nie wyświetla — grupy linków biorą się z menu działu)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{nazwa}"
    hidden: true
    fields:
    - name: nazwa
      label: Nazwa
      type: string
      required: true
    - name: nazwa_en
      label: 'EN: nazwa'
      type: string
    - name: adres
      label: Adres strony (https://… albo /ścieżka na naszej stronie)
      type: string
      required: true
- name: strony
  label: Strony Popularyzacji
  description: Adres strony = ścieżka pliku, np. popularyzacja/uczniowie.md → /popularyzacja/uczniowie. Strona z tego katalogu sama dostaje kartę „Dla kogo” na stronie działu; do menu dopisz ją w repozytorium Web-Ustawienia.
  type: collection
  path: src/content/strony/popularyzacja
  format: yaml-frontmatter
  subfolders: true
  filename: '{primary}.md'
  view:
    fields:
    - tytul
    primary: tytul
  fields:
  - name: tytul
    label: Tytuł (nazwa nad kartą „Dla kogo”)
    type: string
    required: true
  - name: body
    label: Treść
    type: code
    options:
      format: markdown
    description: |-
      Oddziel akapity pustą linią. Nagłówek ## tworzy sekcję i pozycję w spisie „Na tej stronie”. Zachowaj {#id} przy istniejących nagłówkach, aby działały ich odnośniki.
      Zwykły tekst, listy i tabele zapisuj bez znaczników układu. Do specjalnych układów używaj :::kafelki, :::kontakty, :::linki, :::etapy i :::ramka{tytul="Tytuł"}. Każdy blok zamknij osobną linią ::: i zostaw pustą linię między znacznikiem a treścią.
      Komentarze <!-- ... --> zawierają wskazówki dla redaktorów. Szczegóły opisuje dok/jawny-markdown.md w Web-Core.
  - name: tytul_en
    label: Tytuł EN
    type: string
  - name: tresc_en
    label: Treść EN
    description: Cała strona po angielsku, według tych samych reguł Markdown co pole Treść. Zachowaj identyfikatory angielskich sekcji. Gdy pole jest puste, strona angielska pokazuje tekst polski.
    type: code
    options:
      format: markdown
  - name: format_tresci
    label: Format treści
    type: string
    hidden: true
    default: jawne
  - name: opis
    label: Opis (baner strony, zdanie na karcie „Dla kogo”)
    type: text
  - name: opis_en
    label: 'EN: opis'
    type: text
  - name: haslo
    label: Hasło (baner strony, tytuł karty „Dla kogo”)
    type: string
  - name: haslo_en
    label: 'EN: hasło'
    type: string
  - name: pasek_boczny
    label: Prawy pasek (puste = spis „Na tej stronie”)
    type: select
    options:
      values:
      - oba
      - spis
      - menu
      - brak
